[project]
name = "wf-cruise-ctd"
version = "1.0.0"
description = "Western Flyer CTD processing pipeline — SBE 19plus V2 raw hex to EOS-80 DuckDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Joe Carlisle", email = "joeacarlisle@gmail.com"},
]

# Core runtime dependencies.
# Versions match the environment the cruises were processed with (Python 3.12.10).
# Processing libraries are pinned exactly because results depend on them.
# seabirdscientific 3.x is a breaking rewrite (xarray Datasets); stay on 2.x.
dependencies = [
    "seabirdscientific==2.7.8",
    "gsw==3.6.23",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "duckdb==1.5.4",
    # Visualization & geospatial (required by ctd_holoviews.py): compatible patch updates
    "bokeh~=3.9.1",
    "cartopy~=0.25.0",
    "geoviews~=1.15.1",
    "holoviews~=1.23.1",
    "hvplot~=0.12.2",
    "panel~=1.9.3",
    "pyproj==3.7.2",
    "shapely==2.1.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The pipeline modules live at the project root (no src/ layout).
# Listing them here makes them importable after `pip install -e .`
[tool.setuptools]
py-modules = [
    "main",
    "eos80_processing",
    "sbe19plus_ingestion",
    "ctd_holoviews",
]
